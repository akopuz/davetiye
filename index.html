<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyza Nur & Alperen Nişan Davetiyesi</title>

    <meta property="og:title" content="Beyza Nur & Alperen Nişan Davetiyesi" />
    <meta property="og:description" content="31 Temmuz 2026 Cuma günü gerçekleşecek nişan törenimize davetlisiniz." />
    <meta property="og:image" content="davetiye.jpg" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f4f1ea;
            color: #5c4f43;
            text-align: center;
            line-height: 1.3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 812/1418;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            background-image: url('frame.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15% 18% 10% 18%; 
            box-sizing: border-box;
            overflow: hidden;
        }

        .wrapper > * {
            max-width: 100%;
        }

        .main-title {
            font-size: clamp(0.75rem, 2.2vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 500;
            color: #9c8c7d;
            margin-bottom: 10px;
            margin-top: 50px;
            width: 100%;
            text-align: center;
        }

        .names-area {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(2.3rem, 8.5vw, 3.1rem);
            color: #4a3e3d;
            line-height: 1.1;
            margin: 5px 0;
            font-weight: 400;
        }
        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            font-style: italic;
            color: #8c7a6b;
            display: block;
            margin: 2px 0;
        }

        .divider {
            font-size: clamp(0.6rem, 1.5vw, 0.75rem);
            color: #bfa38a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin: 6px 0;
        }
        .divider::before, .divider::after {
            content: "";
            display: inline-block;
            width: 15px;
            height: 1px;
            background-color: #dcd1c7;
        }

        .guest-welcome {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3.2vw, 1.15rem);
            color: #7a6652;
            font-style: italic;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .invitation-text {
            font-size: clamp(0.65rem, 2.4vw, 0.88rem);
            color: #665647;
            font-weight: 400;
            max-width: 215px; 
            margin: 2px auto;
            margin-top: 8px;
            line-height: 1.45;
        }

        .custom-date-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 7px 0;
            font-family: 'Cormorant Garamond', serif;
            color: #5c4f43;
            width: 100%;
        }
        
        .date-top-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            width: 100%;
            max-width: 250px; 
        }
        
        .date-side {
            font-size: clamp(0.72rem, 2.2vw, 0.8rem); 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        
        .date-side.left { text-align: right; padding-right: 12px; }
        .date-side.right { text-align: left; padding-left: 12px; }
        
        .date-center-num {
            font-size: clamp(1.4rem, 4.5vw, 1.7rem); 
            font-weight: 700; 
            padding: 0 12px;
            border-left: 1.5px solid #5c4f43; 
            border-right: 1.5px solid #5c4f43;
            line-height: 1;
            color: #5c4f43;
            text-align: center;
            min-width: 50px;
        }
        
        .date-bottom-row {
            font-size: clamp(0.78rem, 2.3vw, 0.88rem); 
            text-transform: uppercase;
            letter-spacing: 5px; 
            font-weight: 700;
            margin-top: 5px;
            color: #5c4f43;
            text-align: center;
            width: 100%;
        }

        .location-section { margin: 2px 0; }
        .location-title {
            font-size: clamp(0.75rem, 2.4vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #4a3e3d;
            margin-bottom: 1px;
        }
        .location-address {
            font-size: clamp(0.72rem, 2.2vw, 0.82rem);
            color: #736252;
            font-style: italic;
            line-height: 1.25;
        }

        .action-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #e8e2da;
            border-bottom: 1px solid #e8e2da;
            padding: 5px 0;
            margin: 8px 0;
            width: 90%;
flex-wrap: nowrap;
        }
        .action-btn {
 white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #5c4f43;
            font-size: clamp(0.62rem, 1.8vw, 0.7rem);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            transition: color 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }
        .action-btn:hover { color: #bfa38a; }
        .vertical-divider { width: 1px; height: 9px; background-color: #dcd1c7; }

        .heart-icon { color: #bfa38a; font-size: 0.6rem; margin: 1px 0 4px 0; }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px dashed #e8e2da;
            width: 70%;
        }
        .countdown-box span {
            display: block;
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 600;
            color: #4a3e3d;
            line-height: 1;
        }
        .countdown-box label {
            display: block;
            font-size: clamp(0.45rem, 1.2vw, 0.5rem);
            text-transform: uppercase;
            color: #998879;
            letter-spacing: 0.5px;
        }
        .guest-name {
    font-weight: 600;
    color: #3f332f;
    letter-spacing: 0.5px;
}
    </style>
</head>
<body>

    <div class="container">
        <div class="wrapper">
            <div class="main-title">NİŞAN DAVETİYESİ</div>
            
            <div class="names-area">
                Beyza Nur
                <span class="ampersand">&</span>
                Alperen
            </div>
            
            <div class="divider">✦</div>
            <div class="guest-welcome" id="guestWelcome"></div>
            <p class="invitation-text">Hayatlarımızı birleştirme yolunda attığımız bu anlamlı adımda sizleri aramızda görmekten mutluluk duyarız.</p>
            <div class="divider">✦</div>

            <div class="custom-date-section">
                <div class="date-top-grid">
                    <div class="date-side left">Cuma</div>
                    <div class="date-center-num">31</div>
                    <div class="date-side right">19:00</div>
                </div>
                <div class="date-bottom-row">Temmuz</div>
            </div>

            <div class="divider">✦</div>

            <div class="location-section">
                <div class="location-title">CESS WEDDING & ORGANİZASYON</div>
                <div class="location-address">
                    Çengeldere Mah. Çengeldere Caddesi No:116<br>
                    Beykoz / İstanbul
                </div>
            </div>

            <div class="action-group">
                <a href="https://maps.google.com/?cid=16517632844835526774&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQ" target="_blank" class="action-btn">
                    <i class="fa-solid fa-location-dot"></i> Konuma Git
                </a>
                <div class="vertical-divider"></div>
                <button onclick="addToCalendar()" class="action-btn">
                    <i class="fa-regular fa-calendar-days"></i> Takvime Ekle
                </button>
            </div>

            <div class="heart-icon"><i class="fa-solid fa-heart"></i></div>

            <div class="countdown-container">
                <div class="countdown-box"><span id="days">00</span><label>Gün</label></div>
                <div class="countdown-box"><span id="hours">00</span><label>Saat</label></div>
                <div class="countdown-box"><span id="minutes">00</span><label>Dk</label></div>
                <div class="countdown-box"><span id="seconds">00</span><label>Sn</label></div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const guestName = params.get("isim");
        const welcomeDiv = document.getElementById("guestWelcome");

    if (guestName) {
        
        welcomeDiv.innerHTML = `Sayın <span class="guest-name">${guestName}</span>`;
    } else {
        welcomeDiv.style.display = 'none';
    }

        const countToDate = new Date("2026-07-31T19:00:00").getTime();

        const timer = setInterval(function() {
            const currentTime = new Date().getTime();
            const gap = countToDate - currentTime;

            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((gap % (1000 * 60)) / 1000);

            if (gap > 0) {
                document.getElementById("days").innerText = d < 10 ? "0" + d : d;
                document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
                document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
                document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
            } else {
                clearInterval(timer);
                document.querySelector(".countdown-container").innerHTML = "<p style='font-style:italic; font-size:0.7rem;'>O Büyük Gün Geldi!</p>";
            }
        }, 1000);

        function addToCalendar() {
            const title = encodeURIComponent("Beyza Nur & Alperen Nişan Töreni");
            const details = encodeURIComponent("Beyza Nur & Alperen çiftinin nişan merasimine davetlisiniz.");
            const location = encodeURIComponent("Cess Wedding & Organizasyon, Çengeldere Mah. Çengeldere Cd. No:116 Beykoz/İstanbul");
            const startTime = "20260731T160000Z"; 
            const endTime = "20260731T200000Z";
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startTime}/${endTime}&details=${details}&location=${location}&sf=true&output=xml`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
